# Evolve Application - Nginx Configuration
# Deployed alongside existing Nexus application without interfering with port 80
# Serves frontend from /var/www/evolve/dist on port 8080 and proxies /api/ to 127.0.0.1:3001

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Bounded maximum body size matching backend Express limit (15MB) for affirmation audio
    client_max_body_size 15M;

    # Root directory for production frontend build
    root /var/www/evolve/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static assets caching
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Explicitly deny direct access to server uploads directory (private media is served via authenticated /api/affirmation-audio/stream)
    location ^~ /uploads/ {
        deny all;
        return 404;
    }

    # Backend API proxy to local loopback port 3001 (not exposed publicly)
    # ^~ modifier prevents regex static locations from intercepting any /api/ requests
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Ensure API and private media responses are never cached statically by proxy
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        client_max_body_size 15M;
    }

    # Single Page Application routing (fallback to index.html for React router / state)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
